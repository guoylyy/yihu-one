# 发版时构建两个镜像推到 GHCR（amd64 + arm64）：
#   ghcr.io/guoylyy/yihu-one-console:<版本>  控制台。公司安装（更新包方式）时 yh 直接下载它，不用现场构建（yh 的 console_pull）
#   ghcr.io/guoylyy/yihu-one:<版本>、:latest  平台镜像（docker/Dockerfile）：只有 Docker 的机器用它安装，常驻 agent 也是它
# 触发：推 v* 标签（./release.sh / 发版流程里打的标签）；也可以在 Actions 页手动对某个标签重跑
# 不带可选依赖（OMIT_OPTIONAL=1）：OpenHex SDK 不能再分发
name: console-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签，如 v0.5.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 版本号和标签对得上
        id: v
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          [ "v$ver" = "$tag" ] || { echo "VERSION 是 $ver，标签是 $tag，对不上"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: console
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OMIT_OPTIONAL=1
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/guoylyy/yihu-one-console:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 版本号和标签对得上
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          [ "v$ver" = "$tag" ] || { echo "VERSION 是 $ver，标签是 $tag，对不上"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建上下文是导出的平台文件（和更新包一样，不含 export-ignore 的），不是仓库目录
      - run: ./scripts/build-platform-image.sh --push ghcr.io/guoylyy/yihu-one
